name: ToolsCI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  # Runs at 16:00 UTC (BeiJing 00:00) on the 1st of every month
  schedule:
    - cron:  '0 16 1 * *'
  push:
    branches:
      - master
    paths-ignore:
      - .gitee/**
      - .hook/**
      - documentation/**
      - examples/**
      - '**/README.md'
      - '**/README_zh.md'
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - ChangeLog.md
      - MAINTAINERS
  pull_request:
    branches:
      - master
    paths-ignore:
      - .gitee/**
      - .hook/**
      - documentation/**
      - examples/**
      - '**/README.md'
      - '**/README_zh.md'
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - ChangeLog.md
      - MAINTAINERS
  workflow_dispatch:
  repository_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Tools
    if: github.repository_owner == 'RT-Thread'
    strategy:
      fail-fast: false
    env:
      TEST_BSP_ROOT: bsp/stm32/stm32f407-atk-explorer
    steps:
    - uses: actions/checkout@main

    - name: Install Tools
      shell: bash
      run: |
          wget https://raw.githubusercontent.com/RT-Thread/env/master/install_ubuntu.sh
          chmod 777 install_ubuntu.sh
          ./install_ubuntu.sh

    - name: Install Arm ToolChains
      if: ${{ success() }}
      shell: bash
      run: |
        wget -q https://github.com/RT-Thread/toolchains-ci/releases/download/v1.3/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2
        sudo tar xjf gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2 -C /opt
        /opt/gcc-arm-none-eabi-10-2020-q4-major/bin/arm-none-eabi-gcc --version
        echo "RTT_EXEC_PATH=/opt/gcc-arm-none-eabi-10-2020-q4-major/bin" >> $GITHUB_ENV

    - name: Project generate Tools
      if: ${{ success() }}
      run: |
        source ~/.env/env.sh
        echo "Test to generate eclipse project"
        scons --target=eclipse -s -C $TEST_BSP_ROOT
        echo "Test to generate cmake project"
        scons --target=cmake -s -C $TEST_BSP_ROOT
        echo "Test to generate makefile project"
        scons --target=makefile -s -C $TEST_BSP_ROOT
