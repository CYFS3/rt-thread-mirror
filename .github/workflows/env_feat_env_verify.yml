name: verify_env_package_libraries

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/env_feat_env_verify.yml'
      - 'bsp/**/Kconfig'
      - 'bsp/**/rtconfig.h'
      - 'bsp/**/.config'
      - 'bsp/**/SConstruct'
      - 'bsp/**/SConscript'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/env_feat_env_verify.yml'
      - 'bsp/**/Kconfig'
      - 'bsp/**/rtconfig.h'
      - 'bsp/**/.config'
      - 'bsp/**/SConstruct'
      - 'bsp/**/SConscript'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      env_repo:
        description: 'Env repository to verify'
        required: false
        default: 'CYFS3/env'
      env_ref:
        description: 'Env branch, tag, or ref to verify'
        required: false
        default: 'feat_env'
  repository_dispatch:
    types:
      - verify-env-package-libraries

permissions:
  contents: read

concurrency:
  group: verify-env-package-libraries-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    name: ${{ matrix.id }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: at32-f403a-407-reuse
            bsps: |
              bsp/at32/at32f403a-start
              bsp/at32/at32f407-start
            libraries_dir: bsp/at32/libraries
            required_symbols: PKG_USING_AT32F403A_407_HAL_DRIVER PKG_USING_AT32F403A_407_CMSIS_DRIVER
            min_new_dirs: 2
          - id: ft32-f072
            bsps: |
              bsp/ft32/ft32f072xb-starter
            libraries_dir: bsp/ft32/libraries
            required_symbols: PKG_USING_FT32F0_STD_DRIVER PKG_USING_FT32F0_CMSIS_DRIVER
            min_new_dirs: 2
          - id: gd32-vw55x
            bsps: |
              bsp/gd32/risc-v/gd32vw553h-eval
            libraries_dir: bsp/gd32/risc-v/libraries
            required_symbols: PKG_USING_GD32_RISCV_SERIES_DRIVER
            min_new_dirs: 1
          - id: hc32-f4-reuse
            bsps: |
              bsp/hc32/ev_hc32f448_lqfp80
              bsp/hc32/ev_hc32f472_lqfp100
            libraries_dir: bsp/hc32/libraries
            required_symbols: PKG_USING_HC32F4_CMSIS_DRIVER PKG_USING_HC32F4_SERIES_DRIVER
            min_new_dirs: 2
          - id: hpmicro-reuse
            bsps: |
              bsp/hpmicro/hpm5300evk
              bsp/hpmicro/hpm5301evklite
            libraries_dir: bsp/hpmicro/libraries
            required_symbols: PKG_USING_HPM_SDK
            min_new_dirs: 1
          - id: nuvoton-reuse
            bsps: |
              bsp/nuvoton/numaker-m032ki
              bsp/nuvoton/numaker-m2354
            libraries_dir: bsp/nuvoton/libraries
            required_symbols: PKG_USING_NUVOTON_SERIES_DRIVER
            min_new_dirs: 1
          - id: nxp-mcx-mcxa-reuse
            bsps: |
              bsp/nxp/mcx/mcxa/frdm-mcxa366
              bsp/nxp/mcx/mcxa/frdm-mcxa346
            libraries_dir: bsp/nxp/mcx/mcxa/libraries
            required_symbols: PKG_USING_NXP_MCX_CMSIS_DRIVER PKG_USING_NXP_MCX_SERIES_DRIVER
            min_new_dirs: 2
          - id: nxp-imx-imxrt-reuse
            bsps: |
              bsp/nxp/imx/imxrt/imxrt1052-nxp-evk
              bsp/nxp/imx/imxrt/imxrt1170-nxp-evk
              bsp/nxp/imx/imxrt/imxrt1052-seeed-ArchMix
              bsp/nxp/imx/imxrt/imxrt1021-nxp-evk
              bsp/nxp/imx/imxrt/imxrt1060-nxp-evk
              bsp/nxp/imx/imxrt/imxrt1052-atk-commander
              bsp/nxp/imx/imxrt/imxrt1061-forlinx-OK1061-S
              bsp/nxp/imx/imxrt/imxrt1052-fire-pro
              bsp/nxp/imx/imxrt/imxrt1064-nxp-evk
            libraries_dir: bsp/nxp/imx/imxrt/libraries
            required_symbols: PKG_USING_NXP_IMXRT_DRIVER
            min_new_dirs: 1
          - id: nxp-lpc-lpc55s-series-reuse
            bsps: |
              bsp/nxp/lpc/lpc55sxx/lpc55s16_nxp_evk
              bsp/nxp/lpc/lpc55sxx/lpc55s36_nxp_evk
              bsp/nxp/lpc/lpc55sxx/lpc55s06_nxp_evk
              bsp/nxp/lpc/lpc55sxx/lpc55s28_nxp_evk
              bsp/nxp/lpc/lpc55sxx/lpc55s69_nxp_evk
            libraries_dir: bsp/nxp/lpc/lpc55sxx/libraries
            required_symbols: PKG_USING_NXP_LPC55S_DRIVER
            min_new_dirs: 1
          - id: stm32-f1-reuse
            bsps: |
              bsp/stm32/stm32f103-100ask-pro
              bsp/stm32/stm32f103-atk-nano
            libraries_dir: bsp/stm32/libraries
            required_symbols: PKG_USING_STM32F1_HAL_DRIVER PKG_USING_STM32F1_CMSIS_DRIVER
            min_new_dirs: 2

    env:
      ENV_REPO: ${{ github.event.inputs.env_repo || github.event.client_payload.env_repo || vars.ENV_PACKAGE_VERIFY_REPO || 'CYFS3/env' }}
      ENV_REF: ${{ github.event.inputs.env_ref || github.event.client_payload.env_ref || vars.ENV_PACKAGE_VERIFY_REF || 'feat_env' }}
      BSPS: ${{ matrix.bsps }}
      LIBRARIES_DIR: ${{ matrix.libraries_dir }}
      REQUIRED_SYMBOLS: ${{ matrix.required_symbols }}
      MIN_NEW_DIRS: ${{ matrix.min_new_dirs }}

    steps:
      - name: Checkout rt-thread
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git wget
          python3 -m pip install --upgrade pip
          python3 -m pip install scons kconfiglib requests tqdm pyyaml
          python3 -c "import kconfiglib, requests, tqdm, yaml; print('python deps ok')"
          command -v scons
          scons --version
          git config --global http.postBuffer 524288000
          echo "RTT_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "RTT_CC=gcc" >> "${GITHUB_ENV}"

      - name: Install env under test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${HOME}/.env"

          if [[ "${ENV_REPO}" == http://* || "${ENV_REPO}" == https://* || "${ENV_REPO}" == git@* ]]; then
            env_git_url="${ENV_REPO}"
          else
            env_git_url="https://github.com/${ENV_REPO}.git"
          fi

          rm -rf /tmp/env-under-test
          git clone --depth 1 --branch "${ENV_REF}" "${env_git_url}" /tmp/env-under-test
          chmod +x /tmp/env-under-test/install_ubuntu.sh
          /tmp/env-under-test/install_ubuntu.sh

          test -d "${HOME}/.env/tools/scripts"
          git -C "${HOME}/.env/tools/scripts" submodule update --init --depth 1
          if [ -f "${HOME}/.env/tools/scripts/requirements.txt" ]; then
            python3 -m pip install -r "${HOME}/.env/tools/scripts/requirements.txt"
          fi

          git -C "${HOME}/.env/tools/scripts" log -1 --oneline
          expected_commit="$(git -C /tmp/env-under-test rev-parse HEAD)"
          installed_commit="$(git -C "${HOME}/.env/tools/scripts" rev-parse HEAD)"
          if [ -n "${expected_commit}" ] && [ "${installed_commit}" != "${expected_commit}" ]; then
            echo "::error file=install_ubuntu.sh::installer checked out ${installed_commit}, expected ${ENV_REPO}@${ENV_REF} ${expected_commit}"
            git -C "${HOME}/.env/tools/scripts" remote -v
            exit 1
          fi
          source "${HOME}/.env/env.sh"
          command -v pkgs

      - name: Verify package download location
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.env/env.sh"

          if [ -e "${LIBRARIES_DIR}" ]; then
            git clean -ffdx -- "${LIBRARIES_DIR}"
          fi
          mkdir -p "${LIBRARIES_DIR}"

          before_dirs="$(mktemp)"
          first_after_dirs="$(mktemp)"
          first_package_dirs="$(mktemp)"
          find "${LIBRARIES_DIR}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > "${before_dirs}"

          mapfile -t bsp_list < <(printf '%s\n' "${BSPS}" | sed '/^[[:space:]]*$/d')
          if [ "${#bsp_list[@]}" -eq 0 ]; then
            echo "::error::empty BSP list"
            exit 1
          fi

          validate_package_bridges() {
            local bsp="$1"
            local package_dirs_file="$2"
            local packages_root="${bsp}/packages"

            if [ ! -d "${packages_root}" ]; then
              echo "::error file=${packages_root}::expected BSP package bridge directory"
              exit 1
            fi

            while IFS= read -r package_dir; do
              [ -n "${package_dir}" ] || continue

              local source_dir="${LIBRARIES_DIR}/${package_dir}"
              local bridge_dir="${packages_root}/${package_dir}"
              local bridge_sconscript="${bridge_dir}/SConscript"

              if [ ! -d "${source_dir}" ]; then
                echo "::error file=${source_dir}::package source directory is missing from shared libraries"
                exit 1
              fi
              if [ ! -f "${source_dir}/SConscript" ]; then
                echo "::warning file=${source_dir}/SConscript::shared package source SConscript is missing; bridge SConscript will skip direct source import"
              fi
              if [ ! -d "${bridge_dir}" ]; then
                echo "::error file=${bridge_dir}::BSP package bridge directory is missing"
                exit 1
              fi
              if [ ! -f "${bridge_sconscript}" ]; then
                echo "::error file=${bridge_sconscript}::BSP package bridge SConscript is missing"
                exit 1
              fi
              if ! grep -q "libraries_path_prefix" "${bridge_sconscript}" || \
                 ! grep -q "source_path" "${bridge_sconscript}" || \
                 ! grep -q "SConscript(sconscript)" "${bridge_sconscript}"; then
                echo "::error file=${bridge_sconscript}::BSP package directory must be a bridge to the shared libraries package source"
                exit 1
              fi
            done < "${package_dirs_file}"
          }

          for index in "${!bsp_list[@]}"; do
            bsp="${bsp_list[$index]}"
            echo "::group::${bsp}"
            test -d "${bsp}"

            if [ -e "${bsp}/packages" ]; then
              git clean -ffdx -- "${bsp}/packages"
            fi

            for symbol in ${REQUIRED_SYMBOLS}; do
              if ! grep -REq "^[[:space:]]*#define[[:space:]]+${symbol}([[:space:]]|$)" "${bsp}/rtconfig.h" "${bsp}/.config" 2>/dev/null; then
                echo "::error file=${bsp}/rtconfig.h::${symbol} is not enabled in ${bsp}"
                exit 1
              fi
            done

            scons -C "${bsp}" --pyconfig-silent

            (
              cd "${bsp}"
              pkgs --update
              pkgs --list
            )

            current_dirs="$(mktemp)"
            find "${LIBRARIES_DIR}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > "${current_dirs}"

            if [ "${index}" -eq 0 ]; then
              comm -13 "${before_dirs}" "${current_dirs}" | tee "${first_package_dirs}"
              actual_new_dirs="$(wc -l < "${first_package_dirs}" | tr -d ' ')"
              if grep -Fxq packages "${first_package_dirs}"; then
                echo "::error file=${LIBRARIES_DIR}/packages::packages must be materialized directly under ${LIBRARIES_DIR}, not under a nested packages directory"
                exit 1
              fi
              if [ "${actual_new_dirs}" -lt "${MIN_NEW_DIRS}" ]; then
                echo "::error file=${LIBRARIES_DIR}::expected at least ${MIN_NEW_DIRS} new package directories, got ${actual_new_dirs}"
                echo "Before:"
                cat "${before_dirs}"
                echo "After:"
                cat "${current_dirs}"
                exit 1
              fi
              cp "${current_dirs}" "${first_after_dirs}"
              while IFS= read -r package_dir; do
                touch "${LIBRARIES_DIR}/${package_dir}/.ci_reuse_sentinel"
              done < "${first_package_dirs}"
            else
              extra_dirs="$(mktemp)"
              missing_dirs="$(mktemp)"
              missing_sentinels="$(mktemp)"
              comm -13 "${first_after_dirs}" "${current_dirs}" > "${extra_dirs}"
              comm -23 "${first_after_dirs}" "${current_dirs}" > "${missing_dirs}"
              while IFS= read -r package_dir; do
                if [ ! -f "${LIBRARIES_DIR}/${package_dir}/.ci_reuse_sentinel" ]; then
                  echo "${package_dir}" >> "${missing_sentinels}"
                fi
              done < "${first_package_dirs}"
              if [ -s "${extra_dirs}" ] || [ -s "${missing_dirs}" ]; then
                echo "::error file=${LIBRARIES_DIR}::${bsp} did not reuse the package directories created by ${bsp_list[0]}"
                echo "Extra package directories:"
                cat "${extra_dirs}"
                echo "Missing package directories:"
                cat "${missing_dirs}"
                exit 1
              fi
              if [ -s "${missing_sentinels}" ]; then
                echo "::error file=${LIBRARIES_DIR}::${bsp} recreated package directories instead of reusing them"
                cat "${missing_sentinels}"
                exit 1
              fi
            fi

            validate_package_bridges "${bsp}" "${first_package_dirs}"

            scons -C "${bsp}" --pyconfig-silent
            echo "::endgroup::"
          done

          echo "Package directories reused by this group:"
          comm -13 "${before_dirs}" "${first_after_dirs}"
